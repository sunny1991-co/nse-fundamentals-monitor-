name: NSE Fundamentals Monitor

on:
  push:
    branches: [main]
    paths:
      - 'nse_quarterly_monitor.py'
      - 'nse_fundamentals_check.py'
      - 'annual_fundamental_quality.py'
      - '.github/workflows/quarterly_monitor.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: List repository files
        run: ls -la

      - name: Validate Python syntax
        run: python -m py_compile nse_fundamentals_check.py annual_fundamental_quality.py nse_quarterly_monitor.py

      - name: Check annual baseline files
        run: python nse_fundamentals_check.py

      - name: Strict annual quality screen
        run: python annual_fundamental_quality.py

      - name: Fetch and compare quarterly fundamentals
        run: python nse_quarterly_monitor.py

      - name: Commit generated quarterly reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add annual_fundamental_quality_report.csv annual_fundamental_data_gaps.csv annual_fundamental_quality_summary.csv quarterly_results.csv quarterly_change_report.csv quarterly_unverified_filings.csv quarterly_processed_filings.csv
          if git diff --cached --quiet; then
            echo "No quarterly report changes to commit."
          else
            git commit -m "Update NSE quarterly fundamentals reports"
            git push
          fi
