name: NSE Fundamentals Monitor

on:
  push:
    branches: [main]
    paths:
      - 'nse_quarterly_monitor.py'
      - 'nse_fundamentals_check.py'
      - 'annual_fundamental_quality.py'
      - 'nse_annual_history.py'
      - 'nse_sector_classification.py'
      - '.github/workflows/quarterly_monitor.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

concurrency:
  group: nse-fundamentals-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: List repository files
        run: ls -la

      - name: Validate Python syntax
        run: python -m py_compile nse_fundamentals_check.py nse_annual_history.py nse_sector_classification.py annual_fundamental_quality.py nse_quarterly_monitor.py

      - name: Check annual baseline files
        run: python nse_fundamentals_check.py

      - name: Fetch five-year audited consolidated annual history
        run: python nse_annual_history.py

      - name: Refresh official NSE sector classifications
        run: python nse_sector_classification.py

      - name: Strict annual quality screen
        run: python annual_fundamental_quality.py

      - name: Fetch and compare quarterly fundamentals
        run: python nse_quarterly_monitor.py

      - name: Commit generated reports safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            annual_fundamental_quality_report.csv
            annual_fundamental_data_gaps.csv
            annual_fundamental_quality_summary.csv
            annual_historical_results.csv
            annual_historical_unverified.csv
            annual_history_processed.csv
            nse_sector_map.csv
            quarterly_results.csv
            quarterly_change_report.csv
            quarterly_unverified_filings.csv
            quarterly_processed_filings.csv
            FY2425_checked.csv
            NSE_FY2025-26_Consolidated_Fundamentals_checked.csv
          )

          mkdir -p /tmp/nse-generated-reports
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then cp "$file" "/tmp/nse-generated-reports/$file"; fi
          done

          for attempt in 1 2 3 4; do
            echo "Publish attempt $attempt/4"
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if [[ -f "/tmp/nse-generated-reports/$file" ]]; then
                cp "/tmp/nse-generated-reports/$file" "$file"
                git add "$file"
              fi
            done

            if git diff --cached --quiet; then
              echo "No report changes to commit."
              exit 0
            fi

            git commit -m "Update NSE fundamental verification reports"
            if git push origin HEAD:main; then
              echo "Reports published successfully."
              exit 0
            fi
            echo "Push rejected; will retry from latest main."
            sleep $((attempt * 2))
          done

          echo "Could not publish reports after four attempts."
          exit 1
