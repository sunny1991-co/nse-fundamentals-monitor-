name: One-time official NSE TRI source download attempt
on:
  push:
    branches:
      - probe/official-tri-cloud-download-20261017
permissions:
  contents: read
jobs:
  official-public-data-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal HTTPS client
        run: python -m pip install 'requests>=2.32,<3'
      - name: One legitimate official-host POST (no redirects)
        shell: bash
        env:
          NSE_DATA_DIR: ${{ runner.temp }}/nse-tri-unreviewed
        run: |
          mkdir -p "$NSE_DATA_DIR"
          python - <<'PY'
          import json,os,requests
          from pathlib import Path
          from urllib.parse import urlsplit
          from nifty50_tri_official_import import SOURCE_PAGE,ENDPOINT,fetch_candidate
          d=Path(os.environ["NSE_DATA_DIR"])
          s=requests.Session()
          first=s.get(SOURCE_PAGE,headers={
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
              "Accept":"text/html,application/xhtml+xml",
          },allow_redirects=False,timeout=25)
          print("Official landing page status:",first.status_code)
          loc=first.headers.get("Location","")
          if loc:
              p=urlsplit(loc)
              print("Official landing redirect class:",
                    ("SAME_HOST" if p.hostname == "www.niftyindices.com" else "OTHER_HOST"),
                    "path:",p.path[:120])
          if first.status_code == 200:
              report=fetch_candidate(d,session=s)
          else:
              # Existing fetch remains a single official POST, never follows redirect.
              report=fetch_candidate(d,session=s)
          print("POST result status:",report.get("state"))
          print("POST HTTP:",report.get("http_status"))
          print("Official candidate rows:",report.get("candidate_rows",0))
          print("Auto attested:",report["promoted_to_verified_benchmark"])
          # Investigate redirect destination to distinguish a moved endpoint
          # from an anti-abuse or login page. Print no query or response body.
          post_payload={
              "cinfo":("{'name':'NIFTY 50','startDate':'01-Jan-2017',"
                       "'endDate':'16-Oct-2026','indexName':'NIFTY 50'}")
          }
          r=s.post(ENDPOINT,json=post_payload,headers={
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
              "Referer":SOURCE_PAGE,
              "Content-Type":"application/json; charset=UTF-8",
              "X-Requested-With":"XMLHttpRequest",
              "Accept":"application/json",
          },timeout=25,allow_redirects=False)
          print("Separate official endpoint response:",r.status_code)
          to=urlsplit(r.headers.get("Location",""))
          print("POST redirect host classification:",
                "OFFICIAL" if to.hostname=="www.niftyindices.com" else "OTHER_OR_NO_HOST")
          print("POST redirect path only:",to.path[:120])
          PY
      - name: Keep only the official unreviewed result for owner retrieval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempted-official-nifty50-tri
          path: |
            ${{ runner.temp }}/nse-tri-unreviewed/nifty50_tri_download_candidate.csv
            ${{ runner.temp }}/nse-tri-unreviewed/nifty50_tri_download_receipt.json
            ${{ runner.temp }}/nse-tri-unreviewed/runtime/nifty50_tri_acquisition_status.json
          if-no-files-found: error
          retention-days: 1
