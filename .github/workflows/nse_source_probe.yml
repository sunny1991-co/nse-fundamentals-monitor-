name: NSE source metadata probe

on:
  push:
    branches: [main]
    paths:
      - 'nse_source_probe.py'
      - '.github/workflows/nse_source_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python nse_source_probe.py
